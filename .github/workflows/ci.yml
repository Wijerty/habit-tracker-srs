name: CI - Code Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project files and JavaScript syntax
        run: |
          test -s index.html && test -s style.css && test -f script.js
          node --check script.js
      - name: Run tests
        run: if [ -f package.json ]; then npm test; fi
